services:
  db:
    image: postgres:16-alpine
    container_name: mpixel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpixel
      POSTGRES_PASSWORD: mpixel
      POSTGRES_DB: mpixel
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: mpixel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  minio-data:
